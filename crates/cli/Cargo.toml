[package]
name = "hidshim-cli"
description = "Installs hidshim as a program and checks the pad through XInput and Windows.Gaming.Input"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "hidshim"
path = "src/main.rs"

[dependencies]
hidshim = { workspace = true, features = ["install"] }
windows = { version = "0.62.2", features = ["Gaming_Input", "Foundation_Collections"] }
windows-sys = { workspace = true, features = [
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }
